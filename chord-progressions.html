.prog-empty { padding: 20px; text-align: center; }

.prog-all summary { cursor: pointer; padding: 8px 0; font-weight: 700; }

  .prog-foot .k-btn { flex: 1 1 100%; }
}

<body class="k-body">
<div class="k-app">
  <header class="k-header">
    <div>
      <p class="k-eyebrow">音楽理論</p>
      <h1 class="k-title">コード進行一覧</h1>
      <p class="k-lead">キーワードで探すか、ドロップダウンで進行を選ぶと、その進行だけを表示します。Ⅱ-Ⅴ のようなローマ数字は、キーの主音をⅠとした度数です。</p>
    </div>
  </header>
  <details class="k-fold search-settings" open><summary>検索・表示設定</summary><div class="k-fold-body"><section class="prog-find" aria-label="進行を探す">
    <label class="k-field"><span>キーワードで探す</span><input id="q" type="search" class="k-input" placeholder="例：王道　6451　2-5　切ない" autocomplete="off" enterkeyhint="search"></label>
    <label class="k-field"><span>進行を選ぶ</span><select id="progSelect" class="k-select"></select></label>
  </section>
  <section class="k-controls" aria-label="キーと表示の選択">
    <label class="k-field"><span>キー</span><select id="keySelect" class="k-select"></select></label>
    <div class="k-field"><span>種類</span><div class="k-tabs" id="modeTabs">
      <button type="button" class="k-tab" data-value="all">すべて</button><button type="button" class="k-tab" data-value="major">長調</button><button type="button" class="k-tab" data-value="minor">短調</button>
    </div></div>
    <div class="k-field"><span>表示</span><div class="k-tabs" id="viewTabs">
      <button type="button" class="k-tab" data-value="both">両方</button><button type="button" class="k-tab" data-value="chord">コード名</button><button type="button" class="k-tab" data-value="roman">ローマ数字</button>
    </div></div>
  </section>
  </div></details>
  <div class="prog-chips" id="cats" role="group" aria-label="分類で絞り込み" style="margin-top:12px"></div>
  <div class="prog-note"><p class="k-muted" id="keyNote" aria-live="polite"></p><button type="button" class="k-btn k-btn--sm" id="clearBtn" hidden>絞り込みを解除</button></div>
  <main id="list" class="k-grid"></main>
  <footer class="k-footer">
    <p>進行名は通称です。曲によって細かなコードの種類（7th や sus など）は変わります。</p>
  </footer>
</div>
<script src="data/music-theory.js?v=1.11.0"></script>
<script>
(function () {
  'use strict';
  var STORE = 'kirin-chord-progressions';
  var T = window.musicTheory;
  var list = document.getElementById('list');
  var keyNote = document.getElementById('keyNote');
  if (!T || !T.getProgressionList) {
    list.innerHTML = '<p class="k-card prog-empty">data/music-theory.js を読み込めませんでした。このファイルと同じフォルダの data に置いてください。</p>';
    return;
  }

  var KEY_LABELS = ['C', 'D♭ / C♯', 'D', 'E♭ / D♯', 'E', 'F', 'F♯ / G♭', 'G', 'A♭ / G♯', 'A', 'B♭ / A♯', 'B'];
  var MODE_LABELS = { major: '長調', minor: '短調' };
  var ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  var state = { key: 0, mode: 'all', view: 'both', cat: 'all', q: '', pick: '' };

  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    if (saved.key >= 0 && saved.key < 12) state.key = Number(saved.key);
    if (['all', 'major', 'minor'].indexOf(saved.mode) >= 0) state.mode = saved.mode;
    if (['both', 'chord', 'roman'].indexOf(saved.view) >= 0) state.view = saved.view;
  } catch (e) {}

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ key: state.key, mode: state.mode, view: state.view })); } catch (e) {}
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  /* ---- 検索用の正規化：ローマ数字（Ⅱ・ii）→数字、全角半角、大文字小文字、ひらがな/カタカナ、ハイフン類、♭♯ をそろえる ---- */
  var RN_VAL = { i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7 };
  function norm(s) {
    s = String(s).replace(/[Ⅰ-Ⅶⅰ-ⅶ]/g, function (c) { var n = c.charCodeAt(0); return String(n >= 0x2170 ? n - 0x216f : n - 0x215f); });
    s = s.normalize('NFKC').toLowerCase();
    s = s.replace(/(^|[\s\-])([b#]?)(vii|vi|iv|iii|ii|v|i)(?=$|[\s\-]|m|maj|\d)/g, function (m, a, acc, r) { return a + acc + RN_VAL[r]; });
    s = s.replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 96); });
    s = s.replace(/♭/g, 'b').replace(/♯/g, '#');
    return s.replace(/[\s\-‐–—ー・,、.。()（）\[\]「」]/g, '');
  }

  var base = T.getProgressionList('all');
  var byId = {};
  base.forEach(function (p) {
    byId[p.id] = p;
    var digits = p.chords.map(function (t) { var m = /^([b#]?)([1-7])/.exec(t); return m[1] + m[2]; }).join('');
    var roman = p.chords.map(function (t) { var m = /^([b#]?)([1-7]):?(.*)$/.exec(t); return m[1] + ROMAN[Number(m[2]) - 1].toLowerCase() + m[3]; }).join('');
    p.digits = digits;
    p.hay = norm([p.name, p.aliases.join(' '), p.summary, p.cat, MODE_LABELS[p.mode], digits, roman].join(' ')) + ' ' + norm(digits);
    p.hay = p.hay.replace(/\s+/g, '');
  });

  function matches(p) {
    var terms = state.q.split(/[\s　]+/).filter(Boolean);
    for (var i = 0; i < terms.length; i++) {
      var t = norm(terms[i]);
      if (t && p.hay.indexOf(t) < 0) return false;
    }
    return true;
  }

  /* ---- 画面部品 ---- */
  var qInput = document.getElementById('q');
  var progSelect = document.getElementById('progSelect');
  var keySelect = document.getElementById('keySelect');
  var catBox = document.getElementById('cats');
  var clearBtn = document.getElementById('clearBtn');
  var cats = ['all'].concat(T.getProgressionCategories());

  KEY_LABELS.forEach(function (label, i) {
    var o = el('option', '', label);
    o.value = String(i);
    keySelect.appendChild(o);
  });
  keySelect.value = String(state.key);
  keySelect.addEventListener('change', function () {
    state.key = Number(keySelect.value);
    save();
    render();
  });

  function buildSelect() {
    progSelect.textContent = '';
    var first = el('option', '', '（すべて表示）');
    first.value = '';
    progSelect.appendChild(first);
    T.getProgressionCategories().forEach(function (c) {
      var g = el('optgroup');
      g.label = c;
      base.filter(function (p) { return p.cat === c; }).forEach(function (p) {
        var o = el('option', '', p.name + '（' + MODE_LABELS[p.mode] + '）');
        o.value = p.id;
        g.appendChild(o);
      });
      progSelect.appendChild(g);
    });
    progSelect.value = state.pick;
  }
  progSelect.addEventListener('change', function () {
    setPick(progSelect.value);
  });

  function setPick(id) {
    state.pick = byId[id] ? id : '';
    if (state.pick) { state.q = ''; qInput.value = ''; }
    progSelect.value = state.pick;
    try { history.replaceState(null, '', state.pick ? '#' + state.pick : location.pathname + location.search); } catch (e) {}
    render();
  }

  qInput.addEventListener('input', function () {
    state.q = qInput.value;
    if (state.pick) { state.pick = ''; progSelect.value = ''; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    render();
  });

  function paintCats() {
    catBox.textContent = '';
    cats.forEach(function (c) {
      var b = el('button', 'prog-chip', c === 'all' ? 'すべての分類' : c);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.cat === c));
      b.addEventListener('click', function () {
        state.cat = c;
        if (state.pick) { state.pick = ''; progSelect.value = ''; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
        paintCats();
        render();
      });
      catBox.appendChild(b);
    });
  }

  clearBtn.addEventListener('click', function () {
    state.q = ''; state.cat = 'all'; state.pick = '';
    qInput.value = ''; progSelect.value = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    paintCats();
    render();
  });

  function bindTabs(id, prop) {
    var box = document.getElementById(id);
    var buttons = Array.prototype.slice.call(box.querySelectorAll('.k-tab'));
    function paint() {
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-value') === state[prop])); });
    }
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        state[prop] = b.getAttribute('data-value');
        paint();
        save();
        render();
      });
    });
    paint();
  }
  bindTabs('modeTabs', 'mode');
  bindTabs('viewTabs', 'view');

  function copyText(text, button) {
    var done = function () {
      button.textContent = 'コピーしました';
      setTimeout(function () { button.textContent = 'コードをコピー'; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    } else {
      var ta = el('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  function chordList(p) {
    var seq = el('ol', 'prog-seq');
    p.chords.forEach(function (c) {
      var li = el('li', 'prog-chord');
      if (state.view !== 'chord') li.appendChild(el('span', 'rn', c.roman));
      if (state.view !== 'roman') li.appendChild(el('span', 'nm', c.name));
      seq.appendChild(li);
    });
    return seq;
  }

  function card(p, extra) {
    var info = byId[p.id];
    var box = el('article', 'k-card prog-card');
    var head = el('div', 'prog-head');
    head.appendChild(el('h2', '', p.name));
    head.appendChild(el('span', 'k-badge', MODE_LABELS[p.mode] + '・' + p.keyName));
    box.appendChild(head);
    box.appendChild(chordList(p));
    box.appendChild(el('p', 'prog-summary', p.summary));
    var names = info.aliases.filter(function (a) { return /[\u3040-\u30ff\u3400-\u9fff]/.test(a); });
    var meta = '分類：' + info.cat + '　度数：' + info.digits + (names.length ? '　別名：' + names.join('・') : '');
    box.appendChild(el('p', 'prog-meta', meta));

    var foot = el('div', 'prog-foot');
    if (!extra) {
      var one = el('button', 'k-btn k-btn--sm', 'この進行だけ表示');
      one.type = 'button';
      one.addEventListener('click', function () { setPick(p.id); window.scrollTo(0, 0); });
      foot.appendChild(one);
    }
    var btn = el('button', 'k-btn k-btn--sm', 'コードをコピー');
    btn.type = 'button';
    btn.addEventListener('click', function () {
      copyText(p.chords.map(function (c) { return c.name; }).join(' - '), btn);
    });
    foot.appendChild(btn);
    box.appendChild(foot);
    return box;
  }

  function allKeys(id) {
    var d = el('details', 'k-card prog-all');
    d.open = true;
    d.appendChild(el('summary', '', '12のキーすべてで見る'));
    var wrap = el('div', 'prog-table-wrap');
    var table = el('table', 'prog-table');
    var body = el('tbody');
    for (var k = 0; k < 12; k++) {
      var r = T.resolveProgression(id, k);
      var tr = el('tr');
      if (k === state.key) tr.setAttribute('aria-current', 'true');
      tr.appendChild(el('th', '', r.keyName));
      tr.appendChild(el('td', '', r.chords.map(function (c) { return c.name; }).join('  -  ')));
      body.appendChild(tr);
    }
    table.appendChild(body);
    wrap.appendChild(table);
    d.appendChild(wrap);
    return d;
  }

  function render() {
    list.textContent = '';
    var items;
    if (state.pick) {
      items = [byId[state.pick]];
    } else {
      items = base.filter(function (p) {
        return (state.mode === 'all' || p.mode === state.mode) && (state.cat === 'all' || p.cat === state.cat) && matches(p);
      });
    }
    items.forEach(function (item) {
      list.appendChild(card(T.resolveProgression(item.id, state.key), !!state.pick));
    });
    if (state.pick) list.appendChild(allKeys(state.pick));
    if (!items.length) {
      list.appendChild(el('p', 'k-card prog-empty', '「' + state.q + '」に合う進行がありません。別のキーワードや、分類・種類の絞り込みを変えてみてください。'));
    }
    var filtered = !!(state.pick || state.q || state.cat !== 'all');
    clearBtn.hidden = !filtered;
    var major = T.getTonicName(state.key, 'major');
    var minor = T.getTonicName(state.key, 'minor') + 'm';
    keyNote.textContent = 'キー ' + KEY_LABELS[state.key] + '：長調の進行は ' + major + '、短調の進行は ' + minor + ' として表示しています。（' + items.length + ' / ' + base.length + ' 件）';
  }

  function fromHash() {
    var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (byId[id]) { state.pick = id; progSelect.value = id; }
  }
  window.addEventListener('hashchange', function () {
    var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (byId[id] && id !== state.pick) setPick(id);
  });

  buildSelect();
  paintCats();
  fromHash();
  render();
})();
</script>
</body>
