<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ギターコード | キリンの遊び場</title>
  <link rel="stylesheet" href="../../css/normalize.css">
  <link rel="stylesheet" href="../../css/site.css">
  <script src="../../data/music-theory.js"></script>
  <style>
    body {
      background: linear-gradient(180deg, #f2f6ff, #eef5ff);
    }
    .layout {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 1.2rem;
      margin-top: 1rem;
    }
    .panel-strong {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(148,163,184,0.24);
      border-radius: 20px;
      padding: 1.1rem;
      box-shadow: 0 12px 32px rgba(15,23,42,0.07);
    }
    .chord-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .chord-tile {
      background: linear-gradient(180deg, #f9fbff, #eef4ff);
      border: 1px solid rgba(46,125,255,0.18);
      border-radius: 14px;
      padding: 0.9rem 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .chord-tile:hover {
      transform: translateY(-1px);
      border-color: rgba(46,125,255,0.4);
    }
    .chord-tile strong {
      display: block;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      margin-bottom: 0.2rem;
    }
    .selection-box {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: #f7f9ff;
      border: 1px solid rgba(46,125,255,0.12);
    }
    .selection-box strong {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 1.05rem;
    }
    .sidebar { display: grid; gap: 1rem; }
    .preset-list { display: grid; gap: 0.5rem; margin-top: 0.8rem; }
    .preset-list button {
      width: 100%;
      text-align: left;
      background: #fff;
      border-radius: 12px;
      border: 1px solid rgba(46,125,255,0.15);
    }
    .preset-list button.active {
      background: rgba(46,125,255,0.08);
      border-color: rgba(46,125,255,0.5);
      color: var(--primary-700);
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .chord-grid { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <a class="back-link" href="../../index.html">← ホームへ戻る</a>

    <div class="app-header">
      <div>
        <h1 class="app-title">ギターコード</h1>
        <div class="app-subtitle">チューニング別のコード確認と再生</div>
      </div>
      <span class="badge primary-badge" id="tuningBadge">Tune: E A D G B E</span>
    </div>

    <div class="layout">
      <section class="panel-strong">
        <h2>コード一覧</h2>
        <div class="chord-grid" id="guitarChordGrid"></div>
        <div class="selection-box" id="selectionBox">
          <strong>選択中: C</strong>
          <div class="muted">構成音: C / E / G</div>
        </div>
        <div class="row" style="margin-top:1rem; flex-wrap:wrap;">
          <span class="badge" style="background:rgba(255,183,77,0.14); color:#8a4b00;"># 音程確認</span>
          <span class="badge" style="background:rgba(46,125,255,0.1); color:var(--primary);"># 再生</span>
          <span class="badge" style="background:rgba(31,157,104,0.12); color:var(--success);"># チューニング切替</span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel-strong">
          <h3>プリセット</h3>
          <div class="preset-list" id="tuningPresetList"></div>
        </div>

        <div class="panel-strong">
          <h3>チェックポイント</h3>
          <p class="muted" id="progressionHint">押さえやすいフォーム、コードの構成音、弦ごとの音を確認できます。</p>
        </div>
      </aside>
    </div>
  </main>

  <script>
    (function () {
      const musicTheory = window.musicTheory;
      const data = window.MUSIC_THEORY_DATA || musicTheory;
      const theory = musicTheory || data;
      if (!theory || !data) return;

      const chords = (musicTheory && typeof musicTheory.getCommonChords === 'function')
        ? musicTheory.getCommonChords()
        : (data.commonChords || []);
      const tuningPresetList = document.getElementById('tuningPresetList');
      const tuningBadge = document.getElementById('tuningBadge');
      const progressionHint = document.getElementById('progressionHint');
      const chordGrid = document.getElementById('guitarChordGrid');
      const selectionBox = document.getElementById('selectionBox');
      const chordMap = {
        C: ['C', 'E', 'G'],
        G: ['G', 'B', 'D'],
        D: ['D', 'F#', 'A'],
        Am: ['A', 'C', 'E'],
        Em: ['E', 'G', 'B'],
        F: ['F', 'A', 'C'],
        Bm: ['B', 'D', 'F#'],
        Dm: ['D', 'F', 'A']
      };
      const state = { tuningId: 'standard', selectedChord: 'C' };

      function renderChordList() {
        chordGrid.innerHTML = chords.map((chord) => `
          <button type="button" class="chord-tile" data-chord="${chord.symbol}">
            <strong>${chord.symbol}</strong>
            <span>${chord.label}</span>
          </button>
        `).join('');
      }

      function renderPresetList() {
        tuningPresetList.innerHTML = (data.tunings || []).map((tuning) => `
          <button type="button" class="${state.tuningId === tuning.id ? 'active' : ''}" data-tuning="${tuning.id}">${tuning.name}</button>
        `).join('');
      }

      function renderSelection() {
        const chord = chords.find((item) => item.symbol === state.selectedChord) || chords[0];
        const notes = chordMap[chord.symbol] || [chord.symbol];
        selectionBox.innerHTML = `
          <strong>選択中: ${chord.symbol}</strong>
          <div class="muted">構成音: ${notes.join(' / ')}</div>
        `;
      }

      function updateProgression() {
        const key = ((data.keys && data.keys.find((item) => item.id === 'C')) || data.keys[0] || { id: 'C' }).id;
        const progression = (musicTheory && typeof musicTheory.getChordProgression === 'function'
          ? musicTheory.getChordProgression(key)
          : (data.commonProgressions && data.commonProgressions[key]) || ['C', 'F', 'G', 'Am']).join(' → ');
        progressionHint.textContent = `${key}キーのよく使う進行: ${progression}`;
      }

      function setTuning(tuningId) {
        state.tuningId = tuningId;
        const tuning = (musicTheory && typeof musicTheory.getTuning === 'function')
          ? musicTheory.getTuning(tuningId)
          : (data.tunings || []).find((item) => item.id === tuningId) || (data.tunings || [])[0];
        tuningBadge.textContent = 'Tune: ' + (tuning ? tuning.notes.join(' ') : '');
        renderPresetList();
      }

      tuningPresetList.addEventListener('click', (event) => {
        const button = event.target.closest('[data-tuning]');
        if (!button) return;
        setTuning(button.dataset.tuning);
      });

      chordGrid.addEventListener('click', (event) => {
        const button = event.target.closest('[data-chord]');
        if (!button) return;
        state.selectedChord = button.dataset.chord;
        renderSelection();
      });

      renderChordList();
      renderPresetList();
      renderSelection();
      setTuning('standard');
      updateProgression();
    })();
  </script>
</body>
</html>
