<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五度圏サークル | キリンの遊び場</title>
  <link rel="stylesheet" href="../../css/normalize.css">
  <link rel="stylesheet" href="../../css/site.css">
  <style>
    body {
      background: linear-gradient(180deg, #f5f5ff, #f3f7ff);
    }
    .wheel-panel {
      display: grid;
      grid-template-columns: minmax(300px, 1.4fr) minmax(220px, 0.9fr);
      gap: 1.2rem;
      align-items: center;
      margin-top: 1rem;
    }
    .wheel-wrap {
      position: relative;
      width: min(72vw, 520px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #eef2ff 62%, #e0e7ff 100%);
      border: 12px solid rgba(79,70,229,0.08);
      box-shadow: inset 0 0 30px rgba(79,70,229,0.05);
    }
    .wheel-wrap::before {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(79,70,229,0.12);
    }
    .key {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76px;
      height: 32px;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * var(--radius))) rotate(calc(var(--angle) * -1));
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(37,99,235,0.12);
      color: #1f2937;
    }
    .key.major { background: rgba(46,125,255,0.12); color: var(--primary); }
    .key.minor { background: rgba(52,211,153,0.12); color: #0d8f63; }
    .legend { display: grid; gap: 1rem; }
    .legend-card {
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(79,70,229,0.12);
      border-radius: 16px;
      padding: 1rem;
    }
    .legend-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.7rem;
    }
    .chip {
      display: inline-flex;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .chip.major { background: rgba(46,125,255,0.1); color: var(--primary); }
    .chip.minor { background: rgba(52,211,153,0.12); color: #0d8f63; }
    @media (max-width: 760px) {
      .wheel-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <a class="back-link" href="../../index.html">← ホームへ戻る</a>

    <div class="app-header">
      <div>
        <h1 class="app-title">五度圏サークル</h1>
        <div class="app-subtitle">主要調と関連マイナーを視覚的に巡るツールです。</div>
      </div>
    </div>

    <div class="app-panel wheel-panel">
      <div class="wheel-wrap" aria-label="五度圏ルーレット">
        <div class="key major" style="--angle:0deg; --radius:190px;">C</div>
        <div class="key major" style="--angle:30deg; --radius:190px;">G</div>
        <div class="key major" style="--angle:60deg; --radius:190px;">D</div>
        <div class="key major" style="--angle:90deg; --radius:190px;">A</div>
        <div class="key major" style="--angle:120deg; --radius:190px;">E</div>
        <div class="key major" style="--angle:150deg; --radius:190px;">B</div>
        <div class="key major" style="--angle:180deg; --radius:190px;">F#</div>
        <div class="key major" style="--angle:210deg; --radius:190px;">C#</div>
        <div class="key major" style="--angle:240deg; --radius:190px;">G#</div>
        <div class="key major" style="--angle:270deg; --radius:190px;">D#</div>
        <div class="key major" style="--angle:300deg; --radius:190px;">A#</div>
        <div class="key major" style="--angle:330deg; --radius:190px;">F</div>
      </div>

      <div class="legend">
        <div class="legend-card">
          <h3>メジャーキー</h3>
          <div class="legend-list">
            <span class="chip major">C</span>
            <span class="chip major">G</span>
            <span class="chip major">D</span>
            <span class="chip major">A</span>
            <span class="chip major">E</span>
          </div>
        </div>

        <div class="legend-card">
          <h3>関連マイナー</h3>
          <div class="legend-list">
            <span class="chip minor">Am</span>
            <span class="chip minor">Em</span>
            <span class="chip minor">Bm</span>
            <span class="chip minor">F#m</span>
            <span class="chip minor">C#m</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
