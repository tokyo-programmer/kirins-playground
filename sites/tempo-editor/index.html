<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ボーカルチェック | キリンの遊び場</title>
  <link rel="stylesheet" href="../../css/normalize.css">
  <link rel="stylesheet" href="../../css/site.css">
  <style>
    body {
      background: linear-gradient(180deg, #f8f7ff, #f5f7ff);
    }
    .layout {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 1.2rem;
      margin-top: 1rem;
    }
    .meter-panel,
    .result-panel {
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 20px;
      padding: 1rem;
      box-shadow: 0 14px 32px rgba(15,23,42,0.06);
    }
    .range-row {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      align-items: center;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .bar {
      position: relative;
      height: 18px;
      background: #dfe8ff;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 72%;
      background: linear-gradient(90deg, #2e7dff, #7c3aed);
      border-radius: inherit;
    }
    .piano-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(42px, 1fr));
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .key-box {
      text-align: center;
      background: #f3f4ff;
      border: 1px solid rgba(124,58,237,0.12);
      border-radius: 10px;
      padding: 0.7rem 0.5rem;
      font-weight: 700;
      color: #2f2f46;
    }
    .stats {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.8rem;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.7rem 0.8rem;
      border-radius: 12px;
      background: #f8f7ff;
      border: 1px solid rgba(124,58,237,0.08);
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .piano-grid { grid-template-columns: repeat(4, minmax(42px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <a class="back-link" href="../../index.html">← ホームへ戻る</a>

    <div class="app-header">
      <div>
        <h1 class="app-title">ボーカルチェック</h1>
        <div class="app-subtitle">マイクから音域を測定してピアノ表示</div>
      </div>
      <span class="badge" style="background:rgba(124,58,237,0.12); color:#6d28d9;">Live</span>
    </div>

    <div class="layout">
      <section class="meter-panel">
        <div class="range-row">
          <strong>音域範囲</strong>
          <span>A2 - E5</span>
        </div>
        <div class="bar"><span></span></div>

        <div class="piano-grid">
          <div class="key-box">A2</div>
          <div class="key-box">C3</div>
          <div class="key-box">E3</div>
          <div class="key-box">G3</div>
          <div class="key-box">A3</div>
          <div class="key-box">C4</div>
          <div class="key-box">E4</div>
          <div class="key-box">G4</div>
        </div>
      </section>

      <aside class="result-panel">
        <h3>測定結果</h3>
        <div class="stats">
          <div class="stat"><span>最低音</span><strong>A2</strong></div>
          <div class="stat"><span>最高音</span><strong>E5</strong></div>
          <div class="stat"><span>テノール域</span><strong>適合</strong></div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
