<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ギターコード | キリンの遊び場</title>
  <link rel="stylesheet" href="../../css/normalize.css">
  <link rel="stylesheet" href="../../css/site.css">
  <style>
    body {
      background: linear-gradient(180deg, #f2f6ff, #eef5ff);
    }
    .layout {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr;
      gap: 1.2rem;
      margin-top: 1rem;
    }
    .panel-strong {
      background: #fff;
      border: 1px solid rgba(148,163,184,0.24);
      border-radius: 20px;
      padding: 1.1rem;
      box-shadow: 0 12px 32px rgba(15,23,42,0.07);
    }
    .chord-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .chord-tile {
      background: linear-gradient(180deg, #f9fbff, #eef4ff);
      border: 1px solid rgba(46,125,255,0.18);
      border-radius: 14px;
      padding: 0.9rem 0.75rem;
      text-align: center;
    }
    .chord-tile strong {
      display: block;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      margin-bottom: 0.2rem;
    }
    .sidebar { display: grid; gap: 1rem; }
    .preset-list { display: grid; gap: 0.5rem; margin-top: 0.8rem; }
    .preset-list button {
      width: 100%;
      text-align: left;
      background: #fff;
      border-radius: 12px;
      border: 1px solid rgba(46,125,255,0.15);
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .chord-grid { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <a class="back-link" href="../../index.html">← ホームへ戻る</a>

    <div class="app-header">
      <div>
        <h1 class="app-title">ギターコード</h1>
        <div class="app-subtitle">チューニング別のコード確認と再生</div>
      </div>
      <span class="badge primary-badge">Tune: E A D G B E</span>
    </div>

    <div class="layout">
      <section class="panel-strong">
        <h2>コード一覧</h2>
        <div class="chord-grid">
          <div class="chord-tile"><strong>C</strong><span>ド</span></div>
          <div class="chord-tile"><strong>G</strong><span>ソ</span></div>
          <div class="chord-tile"><strong>D</strong><span>レ</span></div>
          <div class="chord-tile"><strong>Am</strong><span>ラm</span></div>
          <div class="chord-tile"><strong>Em</strong><span>ミm</span></div>
          <div class="chord-tile"><strong>F</strong><span>ファ</span></div>
          <div class="chord-tile"><strong>Bm</strong><span>シm</span></div>
          <div class="chord-tile"><strong>Dm</strong><span>レm</span></div>
        </div>
        <div class="row" style="margin-top:1rem; flex-wrap:wrap;">
          <span class="badge" style="background:rgba(255,183,77,0.14); color:#8a4b00;"># 音程確認</span>
          <span class="badge" style="background:rgba(46,125,255,0.1); color:var(--primary);"># 再生</span>
          <span class="badge" style="background:rgba(31,157,104,0.12); color:var(--success);"># チューニング切替</span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel-strong">
          <h3>プリセット</h3>
          <div class="preset-list">
            <button>Standard</button>
            <button>Drop D</button>
            <button>Open G</button>
          </div>
        </div>

        <div class="panel-strong">
          <h3>チェックポイント</h3>
          <p class="muted">押さえやすいフォーム、コードの構成音、弦ごとの音を確認できます。</p>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
