<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../css/normalize.css">
<link rel="stylesheet" href="../../css/site.css">
<title>U-FRET Singer Manager</title>

<style>
body {
  font-family: system-ui, "Noto Sans JP", sans-serif;
  background: #f5f5f5;
  padding: 20px;
}
/* Responsive improvements for mobile */
@media (max-width:760px){
  body{padding:12px}
  .section{padding:12px;margin:0 0 12px}
  .controls{flex-direction:column;gap:8px}
  input{width:100%}
  nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  nav button{flex:1 1 auto;min-width:0}
  #settingsMenu{left:8px;right:8px;width:auto}
}

/* increase touch targets */
button, .star{min-height:44px;padding:10px 12px}

</style>
</head>

<body>

<!-- 設定ボタン -->
<button id="settingsBtn" style="
  position: fixed;
  top: 10px;
  left: 10px;
  font-size: 20px;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
">⚙️ 設定</button>

<!-- 設定メニュー -->
<div id="settingsMenu" style="
  display:none;
  position: fixed;
  top: 40px;
  left: 10px;
  background: #fff;
  border: 1px solid #ccc;
  padding: 10px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  z-index: 100;
">
  <button onclick="upgradeData()">既存データを最新版形式に変換</button>
  <button id="backupBtn">バックアップを保存</button>
  <button id="restoreBtn">バックアップを読み込む</button>
  <input type="file" id="restoreFile" accept=".json" hidden>
</div>

<h1>🎸 弾き語り管理ツール</h1>

<nav>
  <button onclick="showPage('artists')">アーティスト</button>
  <button onclick="showPage('favorites')">お気に入り</button>
  <button onclick="showPage('history')">履歴</button>
  <button onclick="showPage('requests')">リクエスト</button>
</nav>

<!-- original content preserved below -->

<script>
/* original JS preserved */
</script>

</body>
</html>
