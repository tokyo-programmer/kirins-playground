<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キリンの遊び場</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/site.css">
  <style>
    body{background:linear-gradient(180deg,#fefcf3,#fef9e7);color:var(--text)}
    header{background:linear-gradient(90deg,rgba(46,125,255,0.08),rgba(255,183,77,0.02));padding:1rem 0}
    .hero{max-width:1100px;margin:0 auto;padding:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .hero h1{margin:0;font-size:1.6rem}
    .site-desc{color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:1rem}
    .card{background:var(--surface);padding:14px;border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,.06);text-align:left}
    .card h3{margin:0 0 6px}
    .card p{margin:0 0 8px;color:var(--muted)}
    .card a{display:inline-block}
  </style>
</head>
<body>
  <header>
    <div class="hero">
      <div>
        <h1>キリンの遊び場</h1>
        <div class="site-desc">小さな音楽ユーティリティ集 — 各アプリを開いて確認してください。</div>
      </div>
      <div class="mt-1"><a class="app-button" href="#">管理</a></div>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>アプリ一覧</h2>
      <div class="cards">
        <div class="card">
          <h3>ギターコード</h3>
          <p>チューニング別のコード確認と再生。</p>
          <a class="app-button" href="sites/guitar-chords/index.html">開く</a>
        </div>
        <div class="card">
          <h3>五度圏サークル</h3>
          <p>インタラクティブな五度圏ルーレット。</p>
          <a class="app-button" href="sites/circle-of-fifths/index.html">開く</a>
        </div>
        <div class="card">
          <h3>ボーカルチェック</h3>
          <p>マイクから音域を測定してピアノ表示。</p>
          <a class="app-button" href="sites/vocal-check/index.html">開く</a>
        </div>
        <div class="card">
          <h3>リズムパターン</h3>
          <p>譜面風のリズム作成サポート。</p>
          <a class="app-button" href="sites/tempo-editor/index.html">開く</a>
        </div>
        <div class="card">
          <h3>U-FRET 管理</h3>
          <p>U-FRET の履歴 / お気に入り / バックアップ。</p>
          <a class="app-button" href="sites/u-fret-manager/index.html">開く</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
